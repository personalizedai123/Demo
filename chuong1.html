<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Quiz Chương 1 - Bệnh án ngoại khoa</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Newsreader:opsz,wght@6..72,500;6..72,600;6..72,700&display=swap" rel="stylesheet">
<style>
:root{--ink:#18252b;--muted:#66757b;--paper:#f7f4ed;--card:#fffdf8;--line:#d9ddd7;--teal:#0d746d;--dark:#075650;--orange:#e56d3d;--soft:#e3f1ed;--wrong:#fff0e8}*{box-sizing:border-box}body{margin:0;color:var(--ink);background:radial-gradient(circle at 8% 0%,#e56d3d22,transparent 25rem),linear-gradient(135deg,#f7f4ed,#edf4ef);font-family:"Manrope","Segoe UI",sans-serif}.shell{width:min(1050px,calc(100% - 28px));margin:auto;padding:30px 0 56px}header{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:22px}.eyebrow{color:var(--orange);font-size:12px;font-weight:800;letter-spacing:.15em;text-transform:uppercase}h1{font:600 clamp(2.1rem,5vw,4rem)/.98 "Newsreader",Georgia,serif;letter-spacing:-.02em;margin:9px 0}.intro{color:var(--muted);font-size:14px;line-height:1.6;margin:0}.timer{background:var(--ink);color:#fff;padding:14px 18px;min-width:135px;text-align:center;font-size:21px;font-weight:800}.timer small{display:block;color:#b9d4cd;font-size:10px;letter-spacing:.12em;margin-bottom:7px}.progress-wrap{background:#ffffffad;border:1px solid var(--line);padding:12px 14px;margin-bottom:16px}.progress-meta{display:flex;justify-content:space-between;color:var(--muted);font-size:12px;font-weight:700;margin-bottom:8px}.progress{height:8px;background:#dce6df}.bar{height:100%;width:0;background:var(--teal);transition:width .2s}.list{display:grid;gap:13px}.question{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--orange);padding:19px 20px}.question.single{border-left-color:var(--teal)}.head{display:flex;justify-content:space-between;gap:12px}.num{color:#b64c23;font-size:12px;font-weight:800}.single .num{color:var(--dark)}.type{color:var(--muted);font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;text-align:right}.question h2{font:600 21px/1.3 "Newsreader",Georgia,serif;margin:11px 0 14px}.options{display:grid;gap:8px}.option{display:flex;gap:9px;padding:10px 11px;background:#fff;border:1px solid #e1e5df;cursor:pointer;font-size:14px;line-height:1.45}.option:hover{border-color:var(--teal);background:var(--soft)}input{accent-color:var(--teal);margin-top:3px}.check{border:0;background:var(--orange);color:#fff;cursor:pointer;font:800 12px "Manrope",sans-serif;padding:10px 13px;margin-top:12px}.check:disabled{opacity:.6}.feedback{display:none;margin-top:13px;padding:11px 13px;font-size:13px;line-height:1.55}.feedback.show{display:block}.feedback.ok{background:var(--soft);border-left:4px solid var(--teal);color:var(--dark)}.feedback.no{background:var(--wrong);border-left:4px solid var(--orange);color:#8e321e}.actions{display:flex;justify-content:center;gap:10px;margin:23px 0}.actions button{border:0;padding:13px 20px;cursor:pointer;font:800 13px "Manrope",sans-serif}.submit{color:#fff;background:var(--dark)}.reset{color:var(--ink);background:#dfe8e2}.result{display:none;background:var(--ink);color:#fff;padding:22px;margin-top:18px}.result.show{display:block}.result h2{font:600 30px "Newsreader",Georgia,serif;margin:0 0 5px}.result p{color:#dbe9e4;font-size:14px}.review{display:grid;gap:7px;margin-top:12px}.review-item{background:#fff;color:var(--ink);border-left:4px solid #cc4630;padding:10px 12px;font-size:12px;line-height:1.5}.review-item.ok{border-left-color:var(--teal)}
@media(max-width:650px){.shell{width:calc(100% - 18px);padding-top:20px}header{display:block}.timer{margin-top:16px}.question{padding:16px 13px}.question h2{font-size:19px}}
</style></head>
<body><main class="shell"><header><div><div class="eyebrow">Ngoại cơ sở · Chương 1</div><h1>Bệnh án ngoại khoa</h1><p class="intro">30 câu ôn tập về nguyên tắc lập bệnh án, bệnh sử, khám lâm sàng, chẩn đoán, cận lâm sàng và điều trị.</p></div><div class="timer"><small>THỜI GIAN</small><span id="clock">30:00</span></div></header><section class="progress-wrap"><div class="progress-meta"><span id="answered">0/30 câu đã trả lời</span><span>20 câu đa năng</span></div><div class="progress"><div class="bar" id="bar"></div></div></section><form class="list" id="quiz"></form><div class="actions"><button class="submit" id="submit" type="button">Nộp bài và xem điểm</button><button class="reset" type="button" onclick="location.reload()">Làm lại</button></div><section class="result" id="result"></section></main>
<script>
const questions=[
{q:'Bệnh án ngoại khoa là:',o:['Văn bản ghi nhận quá trình khám và điều trị người bệnh ngoại khoa','Phiếu thu viện phí','Danh sách thuốc của khoa','Biên bản xuất viện'],a:[0],e:'Bệnh án ghi nhận có hệ thống tình trạng, diễn biến, chẩn đoán và điều trị người bệnh.'},
{q:'Nguyên tắc quan trọng khi ghi bệnh án là:',o:['Chính xác và trung thực','Ghi theo trí nhớ của người khác','Bỏ qua triệu chứng không phù hợp','Chỉ ghi chẩn đoán cuối cùng'],a:[0],e:'Thông tin trong bệnh án phải phản ánh đúng sự thật và số liệu thu thập được.'},
{q:'Lý do vào viện là:',o:['Triệu chứng chủ quan khiến người bệnh đi khám','Toàn bộ tiền sử gia đình','Kết quả điều trị sau mổ','Tên người chăm sóc'],a:[0],e:'Lý do vào viện là triệu chứng hoặc vấn đề chính khiến người bệnh đến khám.'},
{q:'Tiền sử gia đình nhằm khai thác:',o:['Bệnh lý có tính chất gia đình hoặc di truyền','Màu mắt của người bệnh','Chi phí điều trị','Lịch trực của bác sĩ'],a:[0],e:'Tiền sử gia đình giúp phát hiện các bệnh có yếu tố di truyền hoặc bệnh lý gia đình.'},
{q:'Khám toàn thân chủ yếu đánh giá:',o:['Tình trạng chung và các biểu hiện toàn thân','Chỉ một vết thương nhỏ','Chỉ kết quả X-quang','Chỉ tiền sử gia đình'],a:[0],e:'Khám toàn thân ghi nhận thể trạng, tri giác, da niêm, mạch, nhiệt độ và các dấu hiệu chung.'},
{q:'Khám thực thể gồm các dấu chứng phát hiện bằng:',o:['Nhìn, sờ, gõ và nghe','Chỉ hỏi bệnh','Chỉ xét nghiệm máu','Chỉ đọc hồ sơ cũ'],a:[0],e:'Khám thực thể sử dụng các kỹ thuật nhìn, sờ, gõ, nghe tùy cơ quan.'},
{q:'Chẩn đoán sơ bộ là:',o:['Chẩn đoán được nghĩ đến nhiều nhất dựa trên lâm sàng ban đầu','Chẩn đoán chắc chắn sau mọi xét nghiệm','Chẩn đoán của người nhà','Danh sách thuốc'],a:[0],e:'Chẩn đoán sơ bộ là nhận định ban đầu, có thể được điều chỉnh sau khi có thêm dữ kiện.'},
{q:'Mục đích của chẩn đoán phân biệt là:',o:['Nêu các bệnh khác có biểu hiện tương tự cần loại trừ','Thay thế khám bệnh','Chỉ định mọi xét nghiệm không cần thiết','Xác nhận chắc chắn một bệnh'],a:[0],e:'Chẩn đoán phân biệt giúp so sánh và loại trừ các bệnh có biểu hiện tương tự.'},
{q:'Biện luận chẩn đoán là:',o:['Giải thích lý do đưa ra các chẩn đoán','Kê đơn thuốc tự động','Ghi thông tin hành chính','Mô tả phòng bệnh'],a:[0],e:'Biện luận chẩn đoán trình bày dữ kiện ủng hộ hoặc chống lại các chẩn đoán.'},
{q:'Cận lâm sàng được chỉ định nhằm:',o:['Bổ sung dữ kiện để chẩn đoán và đánh giá bệnh','Thay thế hoàn toàn bệnh sử','Chỉ để kéo dài thời gian nằm viện','Không liên quan điều trị'],a:[0],e:'Cận lâm sàng hỗ trợ xác định chẩn đoán, mức độ bệnh và định hướng điều trị.'},
{q:'Một bệnh án ngoại khoa đầy đủ thường cần có:',o:['Thông tin hành chính','Lý do vào viện','Bệnh sử','Tiền sử'],a:[0,1,2,3],e:'Các phần này tạo nền tảng để nhận diện người bệnh và diễn tiến bệnh.'},
{q:'Khi khai thác bệnh sử, cần làm rõ:',o:['Thời điểm khởi phát','Diễn biến triệu chứng','Triệu chứng kèm theo','Màu áo người bệnh'],a:[0,1,2],e:'Bệnh sử cần mô tả khởi phát, diễn biến và các triệu chứng liên quan.'},
{q:'Tình trạng lúc nhập viện nên ghi:',o:['Triệu chứng cơ năng','Dấu hiệu thực thể chính','Sinh hiệu cần thiết','Sở thích cá nhân'],a:[0,1,2],e:'Tình trạng lúc nhập viện phản ánh biểu hiện bệnh khi người bệnh bắt đầu được tiếp nhận.'},
{q:'Diễn tiến bệnh phòng cần thể hiện:',o:['Thay đổi triệu chứng theo thời gian','Đáp ứng với điều trị','Biến cố mới xuất hiện','Màu tóc thay đổi'],a:[0,1,2],e:'Diễn tiến bệnh phòng ghi nhận thay đổi lâm sàng và đáp ứng điều trị trong thời gian nằm viện.'},
{q:'Tiền sử bản thân nên khai thác:',o:['Bệnh đã mắc','Phẫu thuật trước đây','Dị ứng và thuốc đang dùng','Tên hàng xóm'],a:[0,1,2],e:'Tiền sử bản thân liên quan bệnh tật, can thiệp, dị ứng và thuốc có thể ảnh hưởng xử trí.'},
{q:'Trong khám lâm sàng, cần ghi:',o:['Thời gian khám','Dấu hiệu toàn thân','Dấu hiệu thực thể tại cơ quan bệnh','Món ăn yêu thích'],a:[0,1,2],e:'Thời điểm khám và các dấu hiệu khách quan giúp theo dõi diễn tiến chính xác.'},
{q:'Khám toàn thân có thể bao gồm:',o:['Tri giác','Thể trạng','Da và niêm mạc','Mạch, nhiệt độ, huyết áp'],a:[0,1,2,3],e:'Đây là những nội dung cơ bản khi đánh giá tình trạng chung người bệnh.'},
{q:'Khám thực thể tại cơ quan bệnh cần:',o:['Mô tả vị trí tổn thương','Ghi kích thước khi phù hợp','Đánh giá đau, tính chất và dấu hiệu liên quan','Chỉ ghi “bình thường”'],a:[0,1,2],e:'Mô tả cụ thể giúp người đọc hiểu tổn thương và theo dõi thay đổi.'},
{q:'Tóm tắt bệnh án nên gồm:',o:['Giới và tuổi','Lý do vào viện','Các dữ kiện bệnh sử quan trọng','Kết quả khám nổi bật'],a:[0,1,2,3],e:'Tóm tắt chọn lọc dữ kiện quan trọng để dẫn tới chẩn đoán.'},
{q:'Chẩn đoán sơ bộ có thể bao gồm:',o:['Bệnh chính','Bệnh nền liên quan','Biến chứng nếu có','Màu tóc'],a:[0,1,2],e:'Chẩn đoán sơ bộ phản ánh bệnh chính, bệnh nền và biến chứng được nghĩ đến.'},
{q:'Khi lập chẩn đoán phân biệt, cần dựa vào:',o:['Triệu chứng lâm sàng','Dấu hiệu thực thể','Kết quả cận lâm sàng phù hợp','Tin đồn không kiểm chứng'],a:[0,1,2],e:'Chẩn đoán phân biệt phải dựa trên dữ kiện y khoa có thể kiểm chứng.'},
{q:'Các nhóm cận lâm sàng có thể được ghi trong bệnh án là:',o:['Xét nghiệm máu','Xét nghiệm nước tiểu','X-quang hoặc thăm dò hình ảnh','Kết quả thăm dò chuyên khoa'],a:[0,1,2,3],e:'Bệnh án có thể tổng hợp xét nghiệm, hình ảnh và thăm dò chuyên khoa liên quan.'},
{q:'Khi ghi kết quả xét nghiệm, cần:',o:['Ghi đúng kết quả','Đặt trong bối cảnh lâm sàng','Ưu tiên kết quả có giá trị chẩn đoán','Tự sửa số liệu cho đẹp'],a:[0,1,2],e:'Kết quả phải trung thực và được diễn giải cùng triệu chứng, dấu hiệu lâm sàng.'},
{q:'Kế hoạch điều trị nên nêu:',o:['Hướng xử trí','Điều trị nguyên nhân','Điều trị triệu chứng khi cần','Không cần theo dõi đáp ứng'],a:[0,1,2],e:'Kế hoạch điều trị cần nêu hướng xử trí, nguyên nhân, triệu chứng và theo dõi.'},
{q:'Điều trị ngoại khoa có thể gồm:',o:['Điều trị nội khoa hỗ trợ','Can thiệp hoặc phẫu thuật khi có chỉ định','Theo dõi diễn biến','Bỏ qua bệnh nền'],a:[0,1,2],e:'Điều trị cần phù hợp nguyên nhân, chỉ định phẫu thuật và tình trạng toàn thân.'},
{q:'Tiên lượng người bệnh phụ thuộc vào:',o:['Mức độ bệnh','Bệnh nền','Đáp ứng điều trị','Màu mắt'],a:[0,1,2],e:'Tiên lượng được đánh giá dựa trên bệnh chính, bệnh kèm và đáp ứng điều trị.'},
{q:'Dự phòng trong bệnh án có thể bao gồm:',o:['Phòng biến chứng','Tư vấn chăm sóc','Theo dõi dấu hiệu cảnh báo','Cam kết chắc chắn không có biến chứng'],a:[0,1,2],e:'Dự phòng cần hướng đến giảm biến chứng và giúp người bệnh nhận biết dấu hiệu cần báo ngay.'},
{q:'Bệnh án hậu phẫu cần ghi rõ:',o:['Đã mổ bệnh gì','Ngày hậu phẫu','Tình trạng sau mổ','Diễn biến vết mổ và điều trị'],a:[0,1,2,3],e:'Bệnh án hậu phẫu tập trung vào phẫu thuật đã thực hiện, ngày mổ và diễn biến sau mổ.'},
{q:'Khi đánh giá người bệnh sau mổ, cần chú ý:',o:['Sinh hiệu','Đau','Vết mổ','Dẫn lưu nếu có'],a:[0,1,2,3],e:'Sinh hiệu, đau, vết mổ và dẫn lưu giúp phát hiện sớm biến chứng hậu phẫu.'},
{q:'Một bệnh án tốt cần bảo đảm:',o:['Đầy đủ','Rõ ràng','Có trình tự thời gian','Bảo mật thông tin người bệnh'],a:[0,1,2,3],e:'Bệnh án phải đầy đủ, dễ theo dõi, đúng diễn tiến và bảo đảm nguyên tắc bảo mật.'}
];
const total=questions.length,quiz=document.getElementById('quiz'),clock=document.getElementById('clock'),answered=document.getElementById('answered'),bar=document.getElementById('bar'),result=document.getElementById('result');let seconds=total*60,submitted=false;
function render(){quiz.innerHTML=questions.map((item,index)=>{const multi=item.a.length>1;return `<article class="question ${multi?'':'single'}"><div class="head"><span class="num">CÂU ${index+1}</span><span class="type">${multi?'Đa năng · chọn nhiều':'Chọn một đáp án'}</span></div><h2>${item.q}</h2><div class="options">${item.o.map((option,value)=>`<label class="option"><input type="${multi?'checkbox':'radio'}" name="q${index}" value="${value}"><span>${String.fromCharCode(65+value)}. ${option}</span></label>`).join('')}</div>${multi?`<button class="check" type="button" data-index="${index}">Kiểm tra câu này</button><button class="retry" type="button" data-retry="${index}" style="display:none">Chọn lại</button>`:''}<div class="feedback" id="feedback-${index}"></div></article>`}).join('');quiz.addEventListener('change',event=>{updateProgress();const article=event.target.closest('.question'),index=[...quiz.children].indexOf(article);if(questions[index].a.length===1)reveal(index)});quiz.addEventListener('click',event=>{const button=event.target.closest('.check'),retry=event.target.closest('.retry');if(button)reveal(Number(button.dataset.index));if(retry)resetQuestion(Number(retry.dataset.retry))})}
function selected(index){return[...document.querySelectorAll(`input[name="q${index}"]:checked`)].map(input=>Number(input.value)).sort((a,b)=>a-b)}function same(a,b){return a.length===b.length&&a.every((value,index)=>value===b[index])}function updateProgress(){const count=questions.reduce((sum,_,index)=>sum+(selected(index).length?1:0),0);answered.textContent=`${count}/${total} câu đã trả lời`;bar.style.width=`${count/total*100}%`}
function reveal(index){const answer=selected(index);if(!answer.length)return;const item=questions[index],correct=same(answer,item.a),feedback=document.getElementById(`feedback-${index}`);feedback.className=`feedback show ${correct?'ok':'no'}`;feedback.innerHTML=`<strong>${correct?'Đúng.':'Chưa đúng.'}</strong> Đáp án: ${item.a.map(value=>`${String.fromCharCode(65+value)}. ${item.o[value]}`).join('; ')}<br>${item.e}`;document.querySelectorAll(`input[name="q${index}"]`).forEach(input=>input.disabled=true);const button=document.querySelector(`[data-index="${index}"]`),retry=document.querySelector(`[data-retry="${index}"]`);if(button)button.disabled=true;if(retry){retry.style.display='inline-block'} }
function resetQuestion(index){document.querySelectorAll(`input[name="q${index}"]`).forEach(input=>{input.checked=false;input.disabled=false});const feedback=document.getElementById(`feedback-${index}`);feedback.className='feedback';feedback.innerHTML='';const button=document.querySelector(`[data-index="${index}"]`),retry=document.querySelector(`[data-retry="${index}"]`);if(button)button.disabled=false;if(retry)retry.style.display='none';updateProgress()}
function formatTime(value){return`${Math.floor(value/60).toString().padStart(2,'0')}:${(value%60).toString().padStart(2,'0')}`}function tick(){if(submitted)return;clock.textContent=formatTime(seconds);if(seconds===0)submitQuiz(true);seconds--}
function submitQuiz(auto=false){if(submitted)return;submitted=true;let score=0;const review=questions.map((item,index)=>{const answer=selected(index),correct=same(answer,item.a);if(correct)score++;const chosen=answer.length?answer.map(value=>`${String.fromCharCode(65+value)}. ${item.o[value]}`).join('; '):'Chưa chọn';return`<div class="review-item ${correct?'ok':''}"><strong>Câu ${index+1}: ${correct?'Đúng':'Chưa đúng'}</strong><br>Bạn chọn: ${chosen}<br><b>Đáp án:</b> ${item.a.map(value=>`${String.fromCharCode(65+value)}. ${item.o[value]}`).join('; ')}<br><b>Giải thích:</b> ${item.e}</div>`}).join('');result.innerHTML=`<h2>${score}/${total} câu · ${Math.round(score/total*100)}%</h2><p>${auto?'Hết giờ, hệ thống đã tự động nộp bài.':'Bài đã được chấm. Xem lại đáp án bên dưới.'}</p><div class="review">${review}</div>`;result.classList.add('show');document.querySelectorAll('input,.check').forEach(input=>input.disabled=true);result.scrollIntoView({behavior:'smooth'})}document.getElementById('submit').addEventListener('click',()=>submitQuiz());render();setInterval(tick,1000);
</script></body></html>
